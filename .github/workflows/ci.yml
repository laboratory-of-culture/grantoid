name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://grant:grant@localhost:5432/grant_assistant?schema=public

    # The isolation tests skip themselves when no database is reachable, which
    # would mean tenancy is never actually verified in CI — the one place it
    # most needs to be. pgvector ships the extension compiled in.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: grant
          POSTGRES_PASSWORD: grant
          POSTGRES_DB: grant_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grant -d grant_assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prisma schema
        run: npx prisma validate

      - name: Migrate
        run: npx prisma migrate deploy

      # The ladder is the product's central claim. If these go red the platform
      # is telling NGOs something it cannot support, so the run stops here.
      - name: Eligibility ladder
        run: npx vitest run packages/schemas/ladder.test.ts

      - name: Unit tests
        run: npx vitest run

      # Catches a schema change nobody propagated to the golden set, and any
      # coverage gap that would let the eval pass while testing nothing.
      - name: Golden set
        run: npx tsx evals/check-fixtures.ts

      # A token system does not erode by decision. It erodes by one #fff under
      # deadline, then another.
      - name: Modernist tokens
        run: node scripts/audit-tokens.mjs
