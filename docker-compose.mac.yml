# Накладка для macOS: модель працює на хості, а не в контейнері.
#
# Docker Desktop на macOS — це Linux-VM без доступу до Metal, тож контейнер з
# Ollama рахував би на CPU. Це приблизно вп'ятеро повільніше, і шестисекундна
# правка в редакторі перетворюється на півхвилини. Ollama ставиться нативно, а
# застосунок дотягується до неї через межу віртуалки.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.mac.yml up -d db app
#
# The `ollama` service from the prod file is pushed into an unused profile here,
# so `docker compose ... up -d` on macOS starts db and app and NOT ollama — a
# container that would listen on the same compose-internal port and compute on
# CPU inside the VM. The symptom is not an error, just a slow system, and it is
# a long hunt. (An overlay cannot delete a service; a profile it never selects
# is the next best thing.)
#
# The rest — db, the storage volume, the 127.0.0.1-only port — carries over from
# docker-compose.prod.yml unchanged.

services:
  ollama:
    profiles: ["gpu-host-only"]

  app:
    environment:
      # host.docker.internal — це адреса хоста з середини VM. Docker Desktop дає
      # її сам; Colima й OrbStack потребують запису нижче.
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
