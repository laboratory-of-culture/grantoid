# Extraction eval fixtures for the #3 defect: text that is NOT a requirement of
# the APPLICANT — a description of the funded service, of the client who
# receives it, or of the submission logistics — must not be extracted as an
# eligibility rule. When it is, the eligibility engine faithfully applies a
# rule that should not exist, and a well-filled organisation is told it is
# ineligible (or a deadline sentence becomes a criterion resolved against a
# random fact).
#
# Mined from live trial data (2026-09). Each case carries the exact quote, what
# the extractor WRONGLY produced, and what it must produce instead. A harness
# that runs the extraction agent over the source and asserts these quotes do
# not become rules is the remaining, model-gated piece — these are its targets.

cases:
  - id: service-team-size
    grant: "Запит пропозицій — послуги професійної супервізії"
    quote: "Послуги передбачають проведення регулярних групових супервізій для команди з 12 психологів"
    wrong:
      extracted_as_rule: true
      kind: MANDATORY
      resolvingFactKey: team_size
      note: >-
        The team of 12 is the CLIENT the service is delivered to, not a size the
        applicant must have. This produced a false NOT_ELIGIBLE for a 16-fact
        organisation whose own team is smaller.
    expected:
      extracted_as_rule: false
      reason: describes the funded activity's beneficiary, not an applicant criterion

  - id: logistics-deadline
    grant: "Запит пропозицій — послуги професійної супервізії"
    quote: "Кінцевий термін подачі пропозицій – 23.09.2026 15-00 за київським часом"
    wrong:
      extracted_as_rule: true
      kind: MANDATORY
      resolvingFactKey: legal_form
      note: A submission deadline became an eligibility rule mapped to legal form.
    expected:
      extracted_as_rule: false
      reason: submission logistics — the deadline is a grant field, not a requirement of the applicant

  - id: logistics-workshop
    grant: "Підтримка надання якісних та доступних послуг"
    quote: "Воркшоп перед поданням заявки. Проєкт проведе онлайн воркшоп перед подачею заявки"
    wrong:
      extracted_as_rule: true
      kind: PREFERRED
      resolvingFactKey: geographic_coverage
      note: An optional pre-application workshop became a preferred eligibility rule.
    expected:
      extracted_as_rule: false
      reason: describes the programme's process, not who may apply
