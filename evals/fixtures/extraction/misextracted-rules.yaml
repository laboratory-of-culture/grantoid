# Extraction eval fixtures for the #3 defect: text that is NOT a requirement of
# the APPLICANT — a description of the funded service, of the client who
# receives it, or of the submission logistics — must not be extracted as an
# eligibility rule. When it is, the eligibility engine faithfully applies a rule
# that should not exist, and a well-filled organisation is told it is ineligible.
#
# Mined from live trial data (2026-09). Each case wraps the real misextracted
# quote in a short synthetic announcement that also states one genuine applicant
# requirement, so the eval checks both directions at once: the fix must drop the
# `bad` quote and keep the `good` one. `evals/run-extraction-eval.ts` runs the
# extraction agent over each `article` and asserts exactly that.

cases:
  - id: service-team-size
    grant: "Запит пропозицій — послуги професійної супервізії"
    # The client the service is delivered to — not a size the applicant needs.
    bad: "Послуги передбачають проведення регулярних групових супервізій для команди з 12 психологів"
    good: "Подаватися можуть лише неприбуткові громадські організації."
    was_mapped_to: team_size
    article: |
      Запит пропозицій — послуги професійної супервізії.
      Послуги передбачають проведення регулярних групових супервізій для команди з 12 психологів.
      Подаватися можуть лише неприбуткові громадські організації.
      Кінцевий термін подачі пропозицій – 23.09.2026.

  - id: logistics-deadline
    grant: "Запит пропозицій — послуги професійної супервізії"
    # A submission deadline — logistics, and it already has its own field.
    bad: "Кінцевий термін подачі пропозицій – 23.09.2026 15-00 за київським часом"
    good: "Заявник має бути зареєстрований у Львівській області."
    was_mapped_to: legal_form
    article: |
      Грантовий конкурс для громадських організацій.
      Заявник має бути зареєстрований у Львівській області.
      Кінцевий термін подачі пропозицій – 23.09.2026 15-00 за київським часом.

  - id: logistics-workshop
    grant: "Підтримка надання якісних та доступних послуг"
    # An optional pre-application workshop — the programme's process, not who applies.
    bad: "Проєкт проведе онлайн воркшоп перед подачею заявки"
    good: "До участі запрошуються організації, що працюють у сфері культури."
    was_mapped_to: geographic_coverage
    article: |
      Підтримка культурних ініціатив.
      До участі запрошуються організації, що працюють у сфері культури.
      Проєкт проведе онлайн воркшоп перед подачею заявки 22 вересня.
